<!doctype html><html><head><meta charset="utf-8"><title>Coffee Rating</title><link rel="stylesheet" href="{{url_for('static',filename='css/main.css')}}"></head><body><main><h1>Coffee Rating</h1><p class="muted">Vote for your favorite. Counts are persisted in SQLite.</p><div class="grid">{% for c in coffees %}<article><h2>{{c.name}}</h2><p>{{c.description}}</p><div class="score">{{c.votes}} votes</div><form method="post" action="{{url_for('vote',coffee_id=c.id)}}"><button>Vote</button></form></article>{% endfor %}</div></main></body></html>
